name: Build TikTok Fixer APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Extract source zip
        run: |
          unzip tiktok-fixer.zip -d source
          # Move contents up so gradle wrapper is at root
          mv source/tiktok-fixer/* .
          rm -rf source

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: tiktok-fixer-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
