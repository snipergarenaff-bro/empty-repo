name: Build TikTok Fixer APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Find and extract zip
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -1)
          echo "Found zip: $ZIP"
          unzip -o "$ZIP" -d extracted/
          echo "Contents after extract:"
          ls extracted/

      - name: Locate project root
        run: |
          PROJECT=$(find extracted/ -name "build.gradle" -not -path "*/app/*" | head -1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT" >> $GITHUB_ENV
          echo "Project root: $PROJECT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Build APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          APK=$(find ${{ env.PROJECT_DIR }} -name "*.apk" | head -1)
          echo "APK_PATH=$APK" >> $GITHUB_ENV
          echo "APK found: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikTokFixer-APK
          path: ${{ env.APK_PATH }}
          retention-days: 7
