name: Build TikTok Fixer APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Extract source zip
        run: |
          unzip tiktok-fixer.zip -d source
          mv source/* .
          rm -rf source

      - name: Download Xposed API jar
        run: |
          curl -L "https://github.com/rovo89/XposedBridge/releases/download/art/XposedBridgeApi-82.jar" \
            -o app/libs/XposedBridgeApi-82.jar

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-fixer-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
