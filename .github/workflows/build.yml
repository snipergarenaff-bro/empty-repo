name: Build TikTok Fixer APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check if zip exists and extract
        run: |
          if [ -f "TikTokFixer.zip" ]; then
            echo "ZIP found, extracting..."
            unzip -o TikTokFixer.zip
            echo "Extracted OK"
          else
            echo "No zip found, using repo files directly"
          fi

      - name: Grant gradlew permission
        run: |
          if [ -f "TikTokFixer/gradlew" ]; then
            chmod +x TikTokFixer/gradlew
          fi

      - name: Build with Gradle
        run: |
          cd TikTokFixer
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTokFixer-APK
          path: TikTokFixer/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
