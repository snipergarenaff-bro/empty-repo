name: Build TikTok Fixer APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extract source zip
        run: |
          unzip tiktok-fixer.zip -d source
          mv source/* .
          rm -rf source

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Patch repositories to include JitPack
        run: |
          # Add jitpack to settings.gradle dependency resolution
          sed -i 's|mavenCentral()|mavenCentral()\n            maven { url "https://jitpack.io" }|g' settings.gradle

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-fixer-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
