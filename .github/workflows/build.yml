name: Build TikTok Fixer APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O gradle.zip
          unzip -q gradle.zip -d $HOME/gradle-install
          export PATH=$HOME/gradle-install/gradle-8.7/bin:$PATH
          echo "GRADLE_HOME=$HOME/gradle-install/gradle-8.7" >> $GITHUB_ENV
          echo "$HOME/gradle-install/gradle-8.7/bin" >> $GITHUB_PATH
          gradle --version

      - name: Download zip from repo
        run: |
          curl -L "https://github.com/snipergarenaff-bro/empty-repo/raw/master/TiktokFixer.zip" -o TiktokFixer.zip
          ls -lh TiktokFixer.zip

      - name: Extract zip
        run: |
          unzip -o TiktokFixer.zip -d extracted/
          ls extracted/

      - name: Locate project root
        run: |
          PROJECT=$(find extracted/ -name "build.gradle" -not -path "*/app/*" | head -1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT" >> $GITHUB_ENV
          echo "Project root: $PROJECT"

      - name: Accept SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android platform
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          gradle assembleDebug --no-daemon --warning-mode none

      - name: Find APK
        run: |
          APK=$(find ${{ env.PROJECT_DIR }} -name "*.apk" | head -1)
          echo "APK_PATH=$APK" >> $GITHUB_ENV
          echo "APK: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTokFixer-APK
          path: ${{ env.APK_PATH }}
          retention-days: 7
